services:
  - type: web
    name: hwaseung-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://hwaseung.vercel.app,http://localhost:2000
    autoDeploy: false