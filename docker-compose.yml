version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    # environment 변수 제거 - api.ts의 동적 감지 로직이 더 유연함
    # 브라우저에서 현재 호스트의 8000 포트로 자동 연결
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NETWORK_MODE=external
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./hwaseung_RnD.db:/app/hwaseung_RnD.db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge