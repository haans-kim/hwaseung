version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    # Frontend는 backend API를 통해서만 데이터 접근
    # DB 파일 직접 마운트 불필요
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NETWORK_MODE=external
      - DB_PATH=/app/hwaseung_RnD.db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./hwaseung_RnD.db:/app/hwaseung_RnD.db:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge