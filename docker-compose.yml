version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "2000:2000"
    # environment 변수 제거 - api.ts의 동적 감지 로직이 더 유연함
    # 브라우저에서 현재 호스트의 8000 포트로 자동 연결
    volumes:
      # DB 파일을 Frontend의 public 폴더에 마운트 (브라우저에서 접근 가능)
      - ./hwaseung_RnD.db:/app/build/hwaseung_RnD.db:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NETWORK_MODE=external
      - DB_PATH=/app/hwaseung_RnD.db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - ./hwaseung_RnD.db:/app/hwaseung_RnD.db:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge